name: Observation source preview
on:
  push:
    branches: [observation-readability-20261113]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/observation-extras.py
      - uses: actions/upload-artifact@v4
        with:
          name: observation-source-preview
          path: preview
          retention-days: 1
